<!doctype html>
<html lang="en">
  <head>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO</title>
  </head>
  <body>
    <main>
      <h1>Добавить задачу</h1>
      <div class="main-form__wrapper">
        <form class="main-form" action="" method="get">
          <input aria-label="Search" class="main-input" type="text" />
          <button class="main-form__submit-button" type="submit">
            Добавить
          </button>
        </form>
      </div>
      <div class="search-form__wrapper">
        <form class="search-form" action="" method="get">
          <input aria-label="Search" class="search-input" type="text" />
          <button class="search-form__submit-button" type="submit">
            Поиск
          </button>
        </form>
      </div>
      <div class="todo-list-wrapper">
        <div class="todo-list__filter-wrapper">
          <button class="todo-list__filter-button" data-filter="all">
            Все
          </button>
          <button class="todo-list__filter-button" data-filter="active">
            Активные
          </button>
          <button class="todo-list__filter-button" data-filter="completed">
            Выполненные
          </button>
        </div>
        <ul class="todo-list"></ul>
      </div>
    </main>
  </body>
</html>
